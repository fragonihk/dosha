ne, which focuses on treating symptoms, Ayurveda identifies your unique constitutional type and prescribes the specific foods, rhythms, and practices that keep your particular nature in balance. Its central insight: there is no single healthy diet or lifestyle for all people. What heals one person may harm another.',ayur_age:"5,000 years old",ayur_age_sub:"Rooted in the Charaka Samhita and Vedic tradition",ayur_personal:"Personalised medicine",ayur_personal_sub:"Your constitution is unique — no universal prescription",ayur_balance:"Balance as health",ayur_balance_sub:"Illness arises when your doshas move out of equilibrium",sec_prakriti:"Your Constitution",sec_prakriti_title:"What is Prakriti?",sec_prakriti_body:"Prakriti (Sanskrit: प्रकृति) is your innate constitutional type — determined at conception and fixed for life. It describes the unique ratio of the three doshas (Vata, Pitta, Kapha) that governs your physiology, psychology, and predispositions. Knowing your Prakriti reveals why you react to foods, stress, seasons, and relationships the way you do — and what you specifically need to flourish.",sec_three:"The Three Energies",sec_three_title:"Understanding the Doshas",sec_prakriti_types:"Constitution Types",sec_prakriti_types_title:"Mono, Bi, and Tri-Doshic",sec_prakriti_types_body:"Most people have one or two dominant doshas. Your score is expressed as a ratio — e.g. 60/30/10 — which determines your constitutional category and shapes the recommendations you receive.",type_mono:"Mono-doshic",type_mono_desc:"One dosha strongly dominates. Clear, predictable traits — but also most prone to that dosha's specific imbalances.",type_bi:"Bi-doshic",type_bi_desc:"Two doshas share influence. Seasonal shifts often toggle which one needs more attention at any given time.",type_tri:"Tri-doshic",type_tri_desc:"All three doshas are roughly equal. Rare and resilient — requires careful seasonal adjustments to stay balanced.",cta_title:"Ready to discover your constitution?",cta_body:"Answer 30 questions across 9 categories — body, mind, digestion, emotions, sleep, and more.",cta_btn:"Start the Assessment →",cta_disclaimer:"For educational and wellness purposes · Not a clinical diagnosis",q_of:"of",q_back:"← Back",q_next:"Next →",q_finish:"View Results →",res_prakriti:"Your Prakriti is",res_constitution:"Constitution",res_ratio_title:"What your ratio means",res_tab_recs:"Recommendations",res_tab_guide:"Dosha Guide",res_primary:"Primary Focus",res_secondary:"Secondary Focus",res_food:"Dietary",res_lifestyle:"Lifestyle",banner_title:"constitution has a unique aromatic profile",banner_body:"Fragoni's certified aromatherapist can recommend the precise essential oils, hydrolates, and blends that address your needs — naturally and safely.",banner_btn_consult:"Book a Free 10-min Session",banner_btn_shop:"Explore Our Products →",aroma_title:"Aromatherapy for",aroma_btn_consult:"Book Free Consultation",aroma_btn_shop:"Shop at Fragoni →",social_title:"Stay connected with Fragoni",social_body:"Follow us for seasonal aromatherapy tips, dosha-balancing blends, and new products curated for your constitution.",restart:"↺ Retake Assessment",disclaimer:"This assessment is for educational and wellness purposes only — not a clinical diagnosis. For medical concerns, please consult a qualified healthcare professional.",balanced:"When in balance",imbalanced:"When out of balance",fav_foods:"Favourable foods",lifestyle_needs:"Lifestyle needs",physical:"Physical traits",mental:"Mental traits",governs:"Governs",season:"Season"},zh:{nav_brand:"督夏體質測評",nav_home:"主頁",nav_retake:"重新測試",lang_toggle:"EN",hero_title_1:"探索你的",hero_title_em:"先天體質",hero_sub:"源自古老阿育吠陀智慧的體質分析系統，揭示你獨特的身心藍圖——以及最適合你的飲食、生活方式與日常節律。",hero_btn:"開始30題體質測評 →",hero_note:"約5分鐘 · 免費 · 無需登入",sec_foundation:"基礎知識",sec_ayurveda_title:"什麼是阿育吠陀？",sec_ayurveda_body:"阿育吠陀——梵文字義為「生命的科學」——是一套源自印度、擁有五千年歷史的整體療癒體系。與著重治療症狀的現代醫學不同，阿育吠陀致力於辨識你獨特的體質類型，並針對性地建議最適合你的飲食、生活節律與日常實踐。其核心洞見在於：世上並不存在適用於所有人的單一健康飲食或生活方式。對一個人有益的，可能對另一個人造成傷害。",ayur_age:"五千年傳承",ayur_age_sub:"根植於《遮羅迦本集》與吠陀傳統",ayur_personal:"個人化醫學",ayur_personal_sub:"你的體質獨一無二——沒有放諸四海皆準的處方",ayur_balance:"平衡即健康",ayur_balance_sub:"當督夏失去平衡，疾病便隨之而生",sec_prakriti:"你的體質",sec_prakriti_title:"什麼是先天體質（Prakriti）？",sec_prakriti_body:"先天體質（梵文：प्रकृति）是你與生俱來的體質類型——在受孕時確定，終生不變。它描述了三種督夏（風型、火型、水型）在你身體與心理中的獨特比例，主宰著你的生理機能、心理傾向與體質弱點。了解自己的先天體質，能揭示你對飲食、壓力、季節與人際關係的反應方式——以及你真正需要什麼才能蓬勃生長。",sec_three:"三種能量",sec_three_title:"認識三種督夏",sec_prakriti_types:"體質類型",sec_prakriti_types_title:"單一型、雙重型與三重型體質",sec_prakriti_types_body:"大多數人擁有一至兩種主導督夏。你的評分以比例呈現——例如60/30/10——決定你的體質類別，並影響你所獲得的個人化建議。",type_mono:"單一督夏型",type_mono_desc:"一種督夏明顯主導。特質清晰可預測——但也最容易出現該督夏的特定失衡問題。",type_bi:"雙重督夏型",type_bi_desc:"兩種督夏共同影響。季節轉換時，往往需要輪流關注哪一種督夏需要更多調理。",type_tri:"三重督夏型",type_tri_desc:"三種督夏大致相當。罕見而具適應力——需要細心的季節性調整以維持平衡。",cta_title:"準備好探索你的體質了嗎？",cta_body:"回答涵蓋9大範疇的30道問題——身體、心理、消化、情緒、睡眠等等。",cta_btn:"開始測評 →",cta_disclaimer:"僅供教育及健康參考之用 · 非臨床診斷",q_of:"/",q_back:"← 上一題",q_next:"下一題 →",q_finish:"查看結果 →",res_prakriti:"你的先天體質是",res_constitution:"體質",res_ratio_title:"你的體質比例意味著什麼",res_tab_recs:"個人化建議",res_tab_guide:"督夏指南",res_primary:"主要調理重點",res_secondary:"次要調理重點",res_food:"飲食建議",res_lifestyle:"生活方式",banner_title:"體質擁有獨特的芳香療癒輪廓",banner_body:"Fragoni 認證芳療師可根據你的體質，為你精準推薦最適合的精油、純露及複方配方——天然、安全、專屬於你。",banner_btn_consult:"預約免費10分鐘網上諮詢",banner_btn_shop:"探索 Fragoni 產品 →",aroma_title:"芳療推薦",aroma_btn_consult:"預約免費諮詢",aroma_btn_shop:"瀏覽 Fragoni 產品 →",social_title:"關注 Fragoni，掌握芳療生活靈感",social_body:"追蹤我們，獲取季節性芳療貼士、督夏平衡配方，以及為你體質精選的新品資訊。",restart:"↺ 重新測評",disclaimer:"此測評僅供教育及健康參考之用，並非臨床診斷。如有健康問題，請諮詢合資格醫療專業人員。",balanced:"平衡時的特質",imbalanced:"失衡時的表現",fav_foods:"適合的食物",lifestyle_needs:"生活方式需求",physical:"生理特徵",mental:"心理特質",governs:"主導範疇",season:"對應季節"}},ic={en:[{id:1,cat:"Body & Build",icon:"🪨",text:"How would you describe your natural body frame?",opts:[{text:"Thin and light — I find it difficult to gain weight even when I eat well",d:"V"},{text:"Medium build, muscular and well-proportioned — I gain and lose weight with moderate effort",d:"P"},{text:"Broad and solid — I gain weight easily and find it hard to lose",d:"K"}]},{id:2,cat:"Skin",icon:"✋",text:"What is your skin texture and quality most of the time?",opts:[{text:"Dry, rough or flaky — especially in cold weather; my skin cracks easily",d:"V"},{text:"Warm, slightly oily and prone to redness, flushing or breakouts",d:"P"},{text:"Thick, smooth and moist — my skin feels cool to the touch and rarely dries out",d:"K"}]},{id:3,cat:"Hair",icon:"🌾",text:"How is your hair naturally, without styling products?",opts:[{text:"Dry, brittle, frizzy or thin — hard to tame in dry or windy weather",d:"V"},{text:"Fine and slightly oily — I noticed early greying or thinning",d:"P"},{text:"Thick, lustrous and naturally wavy or oily",d:"K"}]},{id:4,cat:"Appetite",icon:"🍽️",text:"How do you experience hunger from day to day?",opts:[{text:"It varies greatly — some days I'm ravenous, other days I forget to eat entirely",d:"V"},{text:"Strong and regular — I become irritable, headachy or shaky if I miss a meal",d:"P"},{text:"Low to moderate — I can easily skip a meal without noticing",d:"K"}]},{id:5,cat:"Digestion",icon:"🌀",text:"How is your digestion most of the time?",opts:[{text:"Irregular — I experience gas, bloating or constipation more often than not",d:"V"},{text:"Strong but reactive — heartburn or loose stools appear when I'm stressed or eat spicy food",d:"P"},{text:"Slow and steady — I often feel heavy or sluggish after eating",d:"K"}]},{id:6,cat:"Sleep",icon:"🌙",text:"How do you typically sleep?",opts:[{text:"Light and easily disturbed — I wake often and struggle to fall back asleep",d:"V"},{text:"Moderate — I sleep well but sometimes wake with an active mind around midnight",d:"P"},{text:"Deep, long and very hard to interrupt — I love sleep and always want more",d:"K"}]},{id:7,cat:"Energy",icon:"⚡",text:"How does your energy move through the day?",opts:[{text:"In bursts — I get excited and push hard, then suddenly crash and need to rest",d:"V"},{text:"Sustained and intense — I'm driven and competitive and maintain focus for long periods",d:"P"},{text:"Slow to ignite but steady — once I get going I can endure for a long time",d:"K"}]},{id:8,cat:"Memory",icon:"🧠",text:"How do you learn and retain information?",opts:[{text:"I pick things up very quickly, but also forget them quickly",d:"V"},{text:"I learn at a good pace and retain information sharply and reliably",d:"P"},{text:"I need more time to absorb new information, but once I have it I rarely forget",d:"K"}]},{id:9,cat:"Stress Response",icon:"🌊",text:"When you are under pressure, your mind tends to…",opts:[{text:"Race with anxious thoughts, worst-case scenarios and an inability to switch off",d:"V"},{text:"Become sharply critical — of myself, others and the situation",d:"P"},{text:"Shut down and withdraw — I go quiet, feel stuck and resist taking action",d:"K"}]},{id:10,cat:"Emotions",icon:"💧",text:"When your emotions are out of balance, you most frequently feel…",opts:[{text:"Fear, anxiety, nervousness or an overwhelming sense of uncertainty",d:"V"},{text:"Anger, frustration, jealousy or an intense need to be right",d:"P"},{text:"Sadness, heaviness, possessiveness or a reluctance to let go",d:"K"}]},{id:11,cat:"Decisions",icon:"🎯",text:"How do you typically make decisions?",opts:[{text:"Quickly and intuitively — but I often change my mind shortly after",d:"V"},{text:"Decisively and logically — I trust my analysis and rarely second-guess myself",d:"P"},{text:"Slowly and carefully — I prefer to gather input from others before deciding",d:"K"}]},{id:12,cat:"Climate",icon:"❄️",text:"How do you relate to cold weather?",opts:[{text:"I dislike it greatly — I feel cold constantly and layer up even when others are comfortable",d:"V"},{text:"I actually prefer cooler temperatures — heat bothers me far more than cold",d:"P"},{text:"I am mildly affected by cold but generally tolerate most weather conditions",d:"K"}]},{id:13,cat:"Exercise",icon:"🏃",text:"How do you relate to physical activity?",opts:[{text:"I enjoy moving but tire quickly and find it hard to maintain a consistent routine",d:"V"},{text:"I have high endurance and am naturally competitive — I push hard to win or improve",d:"P"},{text:"I prefer lower intensity activities — getting started is the hardest part, but once going I sustain well",d:"K"}]},{id:14,cat:"Sweating",icon:"💦",text:"How much do you sweat during exertion or heat?",opts:[{text:"Very little — I barely sweat even after vigorous activity",d:"V"},{text:"Profusely — I sweat heavily and it often has a strong odour",d:"P"},{text:"Moderately — a steady, cool perspiration",d:"K"}]},{id:15,cat:"Joints",icon:"🦴",text:"Your joints are typically…",opts:[{text:"Cracking, popping or hypermobile — they feel dry and unoiled",d:"V"},{text:"Flexible and warm, sometimes slightly inflamed or tender",d:"P"},{text:"Strong, stable and well-cushioned — rarely giving me trouble",d:"K"}]},{id:16,cat:"Speech",icon:"🗣️",text:"How do you naturally communicate?",opts:[{text:"Fast and enthusiastic — I jump between ideas and sometimes lose track of my point",d:"V"},{text:"Clear, precise and direct — I speak with confidence and persuasion",d:"P"},{text:"Slow, deliberate and calm — I choose words carefully and speak with a steady rhythm",d:"K"}]},{id:17,cat:"Social",icon:"🌐",text:"How do you tend to behave in social settings?",opts:[{text:"Talkative and scattered — I circulate widely and make many brief connections",d:"V"},{text:"Engaging and opinionated — I enjoy intellectual debate and love to make my point",d:"P"},{text:"Reserved and loyal — I prefer deeper one-on-one connections to large groups",d:"K"}]},{id:18,cat:"Conflict",icon:"⚖️",text:"How do you usually handle conflict?",opts:[{text:"I avoid it — conflict makes me anxious and I often withdraw or change the subject",d:"V"},{text:"I address it head-on, sometimes more bluntly than necessary",d:"P"},{text:"I suppress my feelings to keep the peace, even when I am genuinely upset",d:"K"}]},{id:19,cat:"Routine",icon:"🌅",text:"How does your natural daily rhythm look?",opts:[{text:"Spontaneous and irregular — I find rigid schedules stifling and hard to maintain",d:"V"},{text:"Structured and goal-oriented — I like a clear plan and feel off when it's disrupted",d:"P"},{text:"Stable and consistent — I thrive on routine and find change uncomfortable",d:"K"}]},{id:20,cat:"Environment",icon:"🏠",text:"Your home or workspace tends to be…",opts:[{text:"Creatively cluttered — projects, ideas and half-finished things everywhere",d:"V"},{text:"Orderly and functional — everything has a place and I notice when things are out of it",d:"P"},{text:"Warm and comfortable — full of meaningful objects, cosy furnishings, sentimental items",d:"K"}]},{id:21,cat:"Food Cravings",icon:"🍽️",text:"Which foods do you naturally gravitate toward?",opts:[{text:"Warm, oily, salty and sweet comfort foods — soups, stews, bread, creamy dishes",d:"V"},{text:"Cool, refreshing and slightly bitter foods — salads, raw foods, mint, citrus",d:"P"},{text:"Rich, heavy and sweet indulgent foods — pastries, dairy, comfort carbohydrates",d:"K"}]},{id:22,cat:"Taste",icon:"👅",text:"Which taste do you find most naturally satisfying?",opts:[{text:"Sweet and salty — these tastes feel deeply grounding and comforting to me",d:"V"},{text:"Bitter and astringent — I am drawn to cooling tastes like green tea, pomegranate",d:"P"},{text:"Spicy and pungent — I crave flavours that stimulate and wake me up",d:"K"}]},{id:23,cat:"Health Patterns",icon:"🩺",text:"What are your most common physical health complaints?",opts:[{text:"Dry skin, constipation, joint pain, insomnia, anxiety or poor circulation",d:"V"},{text:"Inflammation, skin rashes, acne, heartburn, infections or excessive body heat",d:"P"},{text:"Weight gain, sinus congestion, lethargy, water retention or frequent colds",d:"K"}]},{id:24,cat:"Chronic Stress",icon:"🌡️",text:"Under prolonged stress, you are most likely to develop…",opts:[{text:"Nervous system issues — anxiety disorders, insomnia, chronic pain or autoimmune flares",d:"V"},{text:"Inflammatory conditions — skin problems, digestive issues, hypertension or burnout",d:"P"},{text:"Metabolic or respiratory issues — weight gain, depression, congestion or low immunity",d:"K"}]},{id:25,cat:"Dreams",icon:"✨",text:"How would you describe your dream life?",opts:[{text:"Vivid, active and frequent — flying, chasing, being chased or rapid scene changes",d:"V"},{text:"Intense and problem-solving — conflict, competition, vivid colour and strong emotions",d:"P"},{text:"Calm, deep and emotional — romantic, watery, slow-moving or deeply peaceful",d:"K"}]},{id:26,cat:"Temperature",icon:"🌡️",text:"Your body temperature naturally runs…",opts:[{text:"Cold — I am always reaching for a blanket or extra layer, even in mild weather",d:"V"},{text:"Hot — I am often the warmest person in the room and seek out cool air",d:"P"},{text:"Cool and steady — I rarely experience temperature extremes in either direction",d:"K"}]},{id:27,cat:"Strengths",icon:"🌟",text:"When you are at your best, your greatest quality is…",opts:[{text:"Creativity, enthusiasm and the ability to see possibilities where others see problems",d:"V"},{text:"Clarity, courage and the natural ability to lead, decide and inspire others",d:"P"},{text:"Compassion, patience and a loyal steadiness that others deeply rely on",d:"K"}]},{id:28,cat:"Finances",icon:"💰",text:"How do you relate to money and spending?",opts:[{text:"I spend impulsively on things that excite me, then worry about money afterward",d:"V"},{text:"I spend strategically and invest with clear goals — money is a tool for achievement",d:"P"},{text:"I save consistently and spend cautiously — financial security matters greatly to me",d:"K"}]},{id:29,cat:"Movement",icon:"🚶",text:"How do you naturally walk or move through space?",opts:[{text:"Quick, light and slightly erratic — my pace and direction change frequently",d:"V"},{text:"Purposeful and direct — I walk at a steady medium pace with clear intent",d:"P"},{text:"Slow, graceful and grounded — I move deliberately and rarely rush",d:"K"}]},{id:30,cat:"Eyes",icon:"👁️",text:"Your eyes are most often…",opts:[{text:"Small, dry and restless — they dart around and tire easily in front of screens",d:"V"},{text:"Medium, sharp and bright — with a focused, penetrating quality",d:"P"},{text:"Large, calm and moist — with naturally long lashes and a soft, steady gaze",d:"K"}]}],zh:[{id:1,cat:"身形體格",icon:"🪨",text:"你天生的體型如何？",opts:[{text:"纖細輕盈——即使吃得不少，也很難增重",d:"V"},{text:"中等身材，肌肉勻稱——體重隨飲食變化而適度起伏",d:"P"},{text:"寬闊結實——容易增重，卻很難減下來",d:"K"}]},{id:2,cat:"皮膚",icon:"✋",text:"你的皮膚質感通常如何？",opts:[{text:"乾燥、粗糙或易脫屑——在寒冷天氣時尤為明顯，容易龜裂",d:"V"},{text:"溫熱、略為油膩，容易泛紅、潮熱或長出暗瘡",d:"P"},{text:"厚實、光滑而濕潤——觸感偏涼，很少乾燥",d:"K"}]},{id:3,cat:"頭髮",icon:"🌾",text:"你的頭髮在不使用造型產品的情況下是怎樣的？",opts:[{text:"乾燥、脆弱、易捲曲或稀疏——在乾燥或多風的環境中難以打理",d:"V"},{text:"幼細略油膩——較早出現白髮或髮量稀疏",d:"P"},{text:"濃密、有光澤，天生波浪或偏油",d:"K"}]},{id:4,cat:"食慾",icon:"🍽️",text:"你每天的飢餓感有多穩定？",opts:[{text:"差異極大——有時食慾旺盛，有時完全忘記吃飯",d:"V"},{text:"強烈而規律——錯過一餐便會感到煩躁、頭痛或發抖",d:"P"},{text:"不強烈——即使錯過一餐也感覺不到什麼",d:"K"}]},{id:5,cat:"消化",icon:"🌀",text:"你的消化系統通常如何？",opts:[{text:"不規律——經常出現脹氣、腹脹或便秘",d:"V"},{text:"消化力強但敏感——壓力大或吃辛辣食物時容易胃灼熱或腹瀉",d:"P"},{text:"緩慢而穩定——飯後常感到沉重或消化遲緩",d:"K"}]},{id:6,cat:"睡眠",icon:"🌙",text:"你通常的睡眠質素如何？",opts:[{text:"淺眠易醒——半夜常常醒來，難以再入睡",d:"V"},{text:"睡眠質素尚可——但有時在半夜會突然思緒活躍",d:"P"},{text:"深沉而持久——很難被打擾，總是希望多睡一會兒",d:"K"}]},{id:7,cat:"精力",icon:"⚡",text:"你的精力在一天中是如何變化的？",opts:[{text:"爆發式——我會突然充滿幹勁，然後驟然崩潰，需要休息",d:"V"},{text:"持續而強烈——我目標明確、具競爭性，能長時間保持專注",d:"P"},{text:"慢熱而持久——一旦投入，便能長時間維持穩定的精力",d:"K"}]},{id:8,cat:"記憶",icon:"🧠",text:"你學習和記憶資訊的方式如何？",opts:[{text:"學得很快，但也忘得很快",d:"V"},{text:"學習速度良好，記憶清晰可靠",d:"P"},{text:"需要較長時間消化新資訊，但一旦記住便很少遺忘",d:"K"}]},{id:9,cat:"壓力反應",icon:"🌊",text:"當你承受壓力時，你的思緒通常會……",opts:[{text:"快速轉動，充滿焦慮的想法和最壞的打算，難以平靜",d:"V"},{text:"變得格外挑剔——對自己、對他人、對整個處境",d:"P"},{text:"關閉退縮——沉默下來，感到困住，不願採取行動",d:"K"}]},{id:10,cat:"情緒",icon:"💧",text:"當你情緒失衡時，你最常感受到的是……",opts:[{text:"恐懼、焦慮、緊張，或強烈的不確定感",d:"V"},{text:"憤怒、沮喪、嫉妒，或強烈想要得到認同的需求",d:"P"},{text:"悲傷、沉重、佔有欲，或不願意放手的感覺",d:"K"}]},{id:11,cat:"決策",icon:"🎯",text:"你通常如何做決定？",opts:[{text:"快速直覺——但往往在決定後不久便後悔或改變主意",d:"V"},{text:"果斷而有邏輯——我相信自己的分析，很少動搖",d:"P"},{text:"緩慢而謹慎——我喜歡蒐集他人意見再作決定",d:"K"}]},{id:12,cat:"氣候",icon:"❄️",text:"你如何面對寒冷的天氣？",opts:[{text:"非常不喜歡——即使別人覺得舒適，我也常常感到寒冷",d:"V"},{text:"其實更喜歡涼爽——炎熱對我的困擾遠大於寒冷",d:"P"},{text:"輕微受影響——我大致上能適應各種天氣",d:"K"}]},{id:13,cat:"運動",icon:"🏃",text:"你如何看待體能活動？",opts:[{text:"喜歡運動但容易疲勞——難以維持穩定的運動習慣",d:"V"},{text:"耐力強且具競爭性——我努力突破極限，力求進步",d:"P"},{text:"偏好低強度活動——開始是最難的部分，但一旦投入便能持續很久",d:"K"}]},{id:14,cat:"排汗",icon:"💦",text:"你在運動或高溫環境下的排汗量如何？",opts:[{text:"極少——即使劇烈運動後也幾乎不出汗",d:"V"},{text:"大量——汗水充沛，且往往帶有較濃的氣味",d:"P"},{text:"適中——穩定而清涼的汗水",d:"K"}]},{id:15,cat:"關節",icon:"🦴",text:"你的關節通常是怎樣的？",opts:[{text:"容易發出響聲或過度靈活——感覺乾澀，缺乏潤滑",d:"V"},{text:"靈活而溫熱，有時輕微發炎或觸痛",d:"P"},{text:"強健、穩定而有良好緩衝——很少出現問題",d:"K"}]},{id:16,cat:"語言表達",icon:"🗣️",text:"你天生的溝通方式如何？",opts:[{text:"語速快且充滿熱情——我在不同話題之間跳躍，有時迷失了原本想說的重點",d:"V"},{text:"清晰、精準而直接——我說話有信心，具說服力",d:"P"},{text:"緩慢、從容而平靜——我仔細選詞，以穩定的節奏表達",d:"K"}]},{id:17,cat:"社交",icon:"🌐",text:"你在社交場合中通常如何表現？",opts:[{text:"健談而分散——我廣泛接觸，建立許多短暫的聯繫",d:"V"},{text:"投入而有主見——我喜歡思想交流和辯論，樂於表達立場",d:"P"},{text:"含蓄而忠誠——我更喜歡深度的一對一連結，而非大型群體",d:"K"}]},{id:18,cat:"衝突",icon:"⚖️",text:"你通常如何處理衝突？",opts:[{text:"我會迴避——衝突令我焦慮，我常常退縮或轉移話題",d:"V"},{text:"我會直接面對——有時比必要的更加直白",d:"P"},{text:"我會壓抑感受以維持和平——即使內心確實感到不安",d:"K"}]},{id:19,cat:"日常節律",icon:"🌅",text:"你自然的日常節奏是怎樣的？",opts:[{text:"隨性而不規律——我覺得固定的時間表令人窒息，難以堅持",d:"V"},{text:"結構化而有目標——我喜歡清晰的計劃，計劃被打亂時會感到不安",d:"P"},{text:"穩定而一致——我在規律中茁壯成長，對改變感到不舒適",d:"K"}]},{id:20,cat:"生活環境",icon:"🏠",text:"你的家或工作空間通常是怎樣的？",opts:[{text:"創意十足的雜亂——到處都是計劃、靈感和未完成的事物",d:"V"},{text:"整潔而實用——每樣東西都有固定位置，一旦亂了我會馬上注意到",d:"P"},{text:"溫暖而舒適——充滿有意義的物品、舒適的裝飾和珍貴的紀念品",d:"K"}]},{id:21,cat:"飲食偏好",icon:"🍽️",text:"你自然傾向於哪類食物？",opts:[{text:"溫熱、油潤、鹹香或甜膩的安慰食品——湯品、燉菜、麵包、忌廉類菜式",d:"V"},{text:"清涼、清爽、略帶苦味的食物——沙律、生食、薄荷、柑橘類",d:"P"},{text:"豐盛、厚重、甜蜜的享受食品——糕點、乳製品、碳水化合物",d:"K"}]},{id:22,cat:"口味偏好",icon:"👅",text:"哪種味道讓你感到最自然的滿足？",opts:[{text:"甜味和鹹味——這些口味讓我感到深深的踏實和安慰",d:"V"},{text:"苦味和澀味——我偏愛清涼的口感，如綠茶、石榴",d:"P"},{text:"辛辣和刺激——我渴望能喚醒和振奮精神的濃烈滋味",d:"K"}]},{id:23,cat:"健康模式",icon:"🩺",text:"你最常見的身體不適是哪些？",opts:[{text:"皮膚乾燥、便秘、關節痛、失眠、焦慮或血液循環不佳",d:"V"},{text:"炎症、皮疹、暗瘡、胃灼熱、感染或體熱過盛",d:"P"},{text:"體重增加、鼻竇充血、倦怠、水腫或頻繁感冒",d:"K"}]},{id:24,cat:"長期壓力",icon:"🌡️",text:"在長期壓力下，你最容易出現……",opts:[{text:"神經系統問題——焦慮症、失眠、慢性疼痛或自體免疫問題",d:"V"},{text:"炎性症狀——皮膚問題、消化問題、高血壓或過勞",d:"P"},{text:"代謝或呼吸系統問題——體重增加、抑鬱、充血或免疫力低下",d:"K"}]},{id:25,cat:"夢境",icon:"✨",text:"你如何形容自己的夢境？",opts:[{text:"生動、活躍而頻繁——飛翔、追逐、被追，或場景快速切換",d:"V"},{text:"強烈而充滿問題解決——衝突、競爭、鮮明色彩和強烈情感",d:"P"},{text:"平靜、深沉而富情感——浪漫、水景、緩慢流動或深度平和",d:"K"}]},{id:26,cat:"體溫",icon:"🌡️",text:"你的體溫天生偏向……",opts:[{text:"偏冷——即使在溫和的天氣中，我也總是想裹著毛毯或多穿一層",d:"V"},{text:"偏熱——我經常是房間裡最暖的人，總是尋找涼爽的空氣",d:"P"},{text:"涼爽而穩定——我很少感受到明顯的體溫極端",d:"K"}]},{id:27,cat:"個人優勢",icon:"🌟",text:"當你狀態最佳時，你最大的優勢是……",opts:[{text:"創造力、熱情，以及在別人看到問題時看到可能性的能力",d:"V"},{text:"清晰、勇氣，以及天生能夠領導、決策和激勵他人的能力",d:"P"},{text:"慈悲、耐心，以及他人深深依賴的忠誠與穩定",d:"K"}]},{id:28,cat:"財務習慣",icon:"💰",text:"你如何對待金錢和消費？",opts:[{text:"我會衝動消費讓我興奮的事物，之後才擔心財務狀況",d:"V"},{text:"我會策略性地消費和投資，有明確目標——金錢是實現成就的工具",d:"P"},{text:"我持續儲蓄，謹慎消費——財務安全對我非常重要",d:"K"}]},{id:29,cat:"動作步態",icon:"🚶",text:"你自然走路或移動的方式如何？",opts:[{text:"快速、輕盈而略顯不規律——我的步伐和方向經常改變",d:"V"},{text:"有目的而直接——我以穩定的中等速度、帶著清晰意圖行走",d:"P"},{text:"緩慢、優雅而踏實——我動作從容，很少匆忙",d:"K"}]},{id:30,cat:"眼神",icon:"👁️",text:"你的眼睛通常是怎樣的？",opts:[{text:"細小、乾燥而靈動——目光游移，在屏幕前容易疲勞",d:"V"},{text:"中等、犀利而明亮——帶有專注而穿透的氣質",d:"P"},{text:"大而平靜，水潤有神——天生睫毛濃密，目光柔和而穩定",d:"K"}]}]},Rf=[{id:1,name:"Abhyanga (warm sesame oil massage)",name_zh:"阿育吠陀溫熱芝麻油按摩",category:"Lifestyle",mitigates:["V"],effect:"Deeply nourishes dry tissue, calms the nervous system, and grounds erratic Vata energy through the skin.",effect_zh:"深層滋養乾燥組織，平靜神經系統，透過皮膚安定散亂的風型能量。"},{id:2,name:"Ghee (clarified butter)",name_zh:"酥油（澄清奶油）",category:"Food",mitigates:["V","P"],effect:"Lubricates joints and intestines, reduces dryness (V) and soothes internal inflammation (P).",effect_zh:"潤滑關節和腸道，改善乾燥（風型），並舒緩內部炎症（火型）。"},{id:3,name:"Warm milk with Ashwagandha",name_zh:"溫熱牛奶配南非醉茄",category:"Food",mitigates:["V"],effect:"Builds ojas (vital essence), calms anxiety, and deeply promotes restful sleep for depleted Vata.",effect_zh:"補充生命精華（Ojas），平靜焦慮，為虛弱的風型體質提供深度安眠。"},{id:4,name:"Coconut oil cooking",name_zh:"椰子油烹飪",category:"Food",mitigates:["P"],effect:"A cooling fat that soothes Pitta's excess heat and reduces digestive and systemic inflammation.",effect_zh:"清涼性質的脂肪，舒緩火型過盛的熱氣，減少消化系統及全身炎症。"},{id:5,name:"Triphala supplement",name_zh:"三果實補充品",category:"Lifestyle",mitigates:["V","P","K"],effect:"Tridoshic herbal formula — gentle bowel regulator, detoxifier, and rejuvenator for all constitutions.",effect_zh:"三督夏草本配方——溫和調節腸道、排毒和滋養，適合所有體質。"},{id:6,name:"Daily meditation (20 min)",name_zh:"每日靜心冥想（20分鐘）",category:"Lifestyle",mitigates:["V","P"],effect:"Reduces cortisol and mental scatter (V) while releasing the intensity and critical nature of Pitta.",effect_zh:"降低皮質醇，減少思緒散亂（風型），並釋放火型的緊張與批判性。"},{id:7,name:"Dry brushing (Garshana)",name_zh:"乾刷按摩（Garshana）",category:"Lifestyle",mitigates:["K"],effect:"Stimulates lymphatic circulation, breaks up Kapha stagnation in tissues, and boosts a sluggish metabolism.",effect_zh:"刺激淋巴循環，打破水型在組織中的停滯，提升遲緩的新陳代謝。"},{id:8,name:"Turmeric in cooking",name_zh:"烹飪加入薑黃",category:"Food",mitigates:["P","K"],effect:"Anti-inflammatory golden spice cools Pitta's inflammation; metabolic stimulant that clears Kapha congestion.",effect_zh:"黃金抗炎香料，冷卻火型炎症；代謝刺激劑，清除水型充血。"},{id:9,name:"CCF tea (cumin, coriander, fennel)",name_zh:"CCF茶（孜然、芫荽、茴香）",category:"Food",mitigates:["V","P","K"],effect:"Classic tridoshic digestive tea that kindles agni (digestive fire) without aggravating any dosha.",effect_zh:"經典三督夏消化茶，在不刺激任何督夏的情況下點燃消化之火。"},{id:10,name:"Neti pot (saline nasal rinse)",name_zh:"鼻壺洗鼻（生理鹽水）",category:"Lifestyle",mitigates:["K"],effect:"Clears Kapha accumulation from the sinuses and respiratory tract; reduces congestion and allergies.",effect_zh:"清除水型在鼻竇和呼吸道的積聚，減少充血和過敏。"},{id:11,name:"Restorative / yin yoga",name_zh:"修復性/陰瑜伽",category:"Lifestyle",mitigates:["V"],effect:"Slow, grounding movement stabilises restless Vata energy and calms an overactive nervous system.",effect_zh:"緩慢、接地氣的動作，穩定不安的風型能量，平靜過度活躍的神經系統。"},{id:12,name:"Moon salutation yoga",name_zh:"月亮式瑜伽",category:"Lifestyle",mitigates:["P"],effect:"Cooling, fluid sequences release excess body heat and competitive intensity inherent to Pitta.",effect_zh:"清涼流暢的動作序列，釋放火型體質過多的體熱和競爭性張力。"},{id:13,name:"Vigorous sun salutation yoga",name_zh:"活力太陽式瑜伽",category:"Lifestyle",mitigates:["K"],effect:"Generates heat, activates lymph flow, and counteracts Kapha's heaviness and physical stagnation.",effect_zh:"產生熱量，激活淋巴流動，對抗水型的沉重感和身體停滯。"},{id:14,name:"Warm cooked root vegetables",name_zh:"溫熱烹煮的根莖蔬菜",category:"Food",mitigates:["V"],effect:"Heavy, moist, grounding quality directly pacifies the light, dry, and cold nature of excess Vata.",effect_zh:"厚重、濕潤、接地氣的特質，直接平衡過盛風型的輕盈、乾燥和寒冷本性。"},{id:15,name:"Bitter greens (kale, dandelion)",name_zh:"苦味蔬菜（羽衣甘藍、蒲公英）",category:"Food",mitigates:["P","K"],effect:"Bitter taste cools Pitta inflammation and blood heat; scrapes Kapha mucus accumulation and excess fat.",effect_zh:"苦味冷卻火型炎症和血熱；刮除水型的黏液積聚和多餘脂肪。"},{id:16,name:"Pomegranate juice",name_zh:"石榴汁",category:"Food",mitigates:["P"],effect:"Astringent and cooling juice that pacifies Pitta heat directly without aggravating Vata's dryness.",effect_zh:"澀味清涼果汁，直接平靜火型熱氣，同時不加重風型的乾燥。"},{id:17,name:"Barley and millet grains",name_zh:"大麥和小米",category:"Food",mitigates:["K"],effect:"Light, dry grains directly counter Kapha's heavy, moist, and slow digestive qualities.",effect_zh:"輕盈乾燥的穀物，直接對抗水型厚重、濕潤和消化緩慢的特質。"},{id:18,name:"Fresh ginger tea",name_zh:"新鮮薑茶",category:"Food",mitigates:["V","K"],effect:"Warming and stimulating spice kindles digestive fire, warms cold Vata, and scrapes Kapha accumulation.",effect_zh:"溫熱刺激的香料，點燃消化之火，溫暖寒冷的風型，並刮除水型的積聚。"},{id:19,name:"Rose water / rose petal jam",name_zh:"玫瑰水／玫瑰花瓣醬",category:"Food",mitigates:["P"],effect:"Deeply cooling and sweet in quality — directly reduces Pitta's heat, irritability, and emotional intensity.",effect_zh:"深度清涼而甜美——直接降低火型的熱氣、煩躁和情緒張力。"},{id:20,name:"Consistent daily sleep schedule",name_zh:"固定的日常睡眠時間表",category:"Lifestyle",mitigates:["V","K"],effect:"Stabilises Vata's irregular energy rhythms while preventing the excessive sleep tendency of Kapha.",effect_zh:"穩定風型不規律的能量節律，同時防止水型過度睡眠的傾向。"},{id:21,name:"Intermittent fasting (light)",name_zh:"間歇性輕斷食",category:"Lifestyle",mitigates:["K"],effect:"Rekindles digestive fire (agni), reduces Kapha accumulation in tissues, and clears Ama (metabolic toxins).",effect_zh:"重燃消化之火（Agni），減少水型在組織中的積聚，清除代謝毒素（Ama）。"},{id:22,name:"Aloe vera juice",name_zh:"蘆薈汁",category:"Food",mitigates:["P","K"],effect:"Cooling anti-inflammatory for Pitta's hot conditions; gentle liver cleanser that clears Kapha congestion.",effect_zh:"火型熱性狀況的清涼抗炎飲品；溫和的肝臟清潔劑，清除水型充血。"},{id:23,name:"Saffron in warm milk",name_zh:"溫熱牛奶配藏紅花",category:"Food",mitigates:["V","P"],effect:"Nourishes ojas (vital energy), gently uplifts mood, and is suitable for both Vata depletion and Pitta heat.",effect_zh:"滋養生命精華，溫和提振情緒，適合風型虛弱和火型過熱。"},{id:24,name:"Black pepper in food",name_zh:"食物加入黑胡椒",category:"Food",mitigates:["K"],effect:"Pungent and hot in quality — directly stimulates the sluggish Kapha metabolism and clears mucus.",effect_zh:"辛辣溫熱特質——直接刺激遲緩的水型新陳代謝，清除黏液。"},{id:25,name:"Fresh coconut water",name_zh:"新鮮椰子水",category:"Food",mitigates:["P"],effect:"Electrolyte-rich cooling drink that effectively reduces Pitta's excess internal heat and acidity.",effect_zh:"富含電解質的清涼飲品，有效降低火型過多的內部熱氣和酸性。"},{id:26,name:"Warm ear oil drops (Karna Purana)",name_zh:"溫熱耳油滴（Karna Purana）",category:"Lifestyle",mitigates:["V"],effect:"Soothes Vata-related tinnitus, ear dryness, and anxiety through the subtle ear-nervous system connection.",effect_zh:"通過耳朵與神經系統的微妙連結，舒緩風型相關的耳鳴、耳部乾燥和焦慮。"},{id:27,name:"Brahmi / Bacopa herb",name_zh:"婆羅米草藥",category:"Lifestyle",mitigates:["V","P"],effect:"Calms the overactive, scattered Vata mind; cools the sharp and critical intellect of excess Pitta.",effect_zh:"平靜過度活躍、散亂的風型思緒；冷卻過盛火型的犀利和批判性智識。"},{id:28,name:"Neem supplement or tea",name_zh:"印楝補充品或茶",category:"Lifestyle",mitigates:["P","K"],effect:"Powerfully bitter herb purifies the blood and cools Pitta; reduces Kapha congestion and mucus buildup.",effect_zh:"強效苦味草藥，淨化血液並冷卻火型；減少水型充血和黏液積聚。"},{id:29,name:"Shatavari (Asparagus racemosus)",name_zh:"天門冬（蘆筍根）",category:"Lifestyle",mitigates:["V","P"],effect:"Deeply nourishing and cooling adaptogen for Vata depletion and tissue deficiency; reduces Pitta inflammation.",effect_zh:"深度滋養和清涼的適應原，適合風型虛弱和組織不足；減少火型炎症。"},{id:30,name:"Morning tongue scraping",name_zh:"早晨刮舌苔",category:"Lifestyle",mitigates:["K"],effect:"Removes overnight Ama (toxins) deposited on the tongue; directly stimulates digestive organs and metabolism.",effect_zh:"清除夜間沉積在舌頭上的毒素（Ama）；直接刺激消化器官和新陳代謝。"},{id:31,name:"Walking in nature (30 min)",name_zh:"在大自然中步行（30分鐘）",category:"Lifestyle",mitigates:["P","K"],effect:"Releases Pitta competitiveness and work intensity; activates Kapha's sluggish circulation and lymph.",effect_zh:"釋放火型的競爭性和工作強度；激活水型遲緩的循環和淋巴系統。"},{id:32,name:"Swimming or water exercise",name_zh:"游泳或水中運動",category:"Lifestyle",mitigates:["P"],effect:"Ideal cooling cardiovascular exercise for Pitta — maximum exertion without the risk of overheating.",effect_zh:"火型的理想清涼有氧運動——最大程度的鍛煉，同時無過熱風險。"},{id:33,name:"Mung beans (well-cooked)",name_zh:"綠豆（充分煮熟）",category:"Food",mitigates:["V","P","K"],effect:"Tridoshic protein source — light, easy to digest, and non-aggravating for all three constitutional types.",effect_zh:"三督夏蛋白質來源——輕盈易消化，對三種體質均無刺激。"},{id:34,name:"Avoid raw cold foods in winter",name_zh:"冬季避免生冷食物",category:"Lifestyle",mitigates:["V"],effect:"Cold, dry, raw food directly spikes Vata imbalance — warm cooked food is non-negotiable in cool months.",effect_zh:"寒冷、乾燥、生食直接加重風型失衡——在涼爽月份必須食用溫熱煮食。"},{id:35,name:"Raw honey (never heated)",name_zh:"生蜂蜜（切勿加熱）",category:"Food",mitigates:["K"],effect:"Scraping and mildly heating quality reduces Kapha's excess mucus, fat, and heaviness in the body.",effect_zh:"刮除和輕微加熱的特質，減少水型體內多餘的黏液、脂肪和沉重感。"},{id:36,name:"Expressive writing / journaling",name_zh:"情感書寫／寫日記",category:"Lifestyle",mitigates:["P"],effect:"Safely releases stored Pitta frustration, criticism, and intensity rather than directing it at others.",effect_zh:"安全釋放積累的火型沮喪、批評和強度，而非將其指向他人。"},{id:37,name:"Nadi Shodhana pranayama",name_zh:"交替鼻孔呼吸法",category:"Lifestyle",mitigates:["V"],effect:"Alternate nostril breathing balances the nervous system and calms Vata anxiety and mental scatter.",effect_zh:"交替鼻孔呼吸法平衡神經系統，平靜風型焦慮和思緒散亂。"},{id:38,name:"Sitali pranayama (cooling breath)",name_zh:"清涼呼吸法（Sitali）",category:"Lifestyle",mitigates:["P"],effect:"Inhaling through a curled tongue directly lowers internal body temperature and reduces Pitta inflammation.",effect_zh:"通過捲舌吸氣，直接降低體內溫度，減少火型炎症。"},{id:39,name:"Kapalabhati (skull-shining breath)",name_zh:"頭顱光明呼吸法",category:"Lifestyle",mitigates:["K"],effect:"Vigorous rhythmic exhale purges Kapha mucus from lungs, kindles agni, and energises a sluggish system.",effect_zh:"有力的節律呼氣從肺部排出水型黏液，點燃消化之火，激活遲緩的系統。"},{id:40,name:"Three regular meals, no snacking",name_zh:"三餐規律，不吃零食",category:"Lifestyle",mitigates:["K"],effect:"Prevents Kapha from accumulating excess — regularity combined with fasting intervals between meals is key.",effect_zh:"防止水型過度積聚——規律性結合餐間空腹時段是關鍵。"},{id:41,name:"Cardamom in cooking and tea",name_zh:"烹飪和茶飲加入豆蔻",category:"Food",mitigates:["V","P","K"],effect:"Classic tridoshic spice that aids digestion, freshens breath, and is gently warming without aggravating.",effect_zh:"經典三督夏香料，幫助消化，清新口氣，溫和加熱而不刺激。"},{id:42,name:"Fennel seeds after meals",name_zh:"飯後茴香籽",category:"Food",mitigates:["V","P"],effect:"Cooling digestive seed that relieves Vata gas and bloating while reducing Pitta acidity and heartburn.",effect_zh:"清涼消化種子，緩解風型脹氣和腹脹，同時減少火型酸性和胃灼熱。"},{id:43,name:"Red meat in moderation",name_zh:"適量紅肉",category:"Food",mitigates:["V"],effect:"Heavy, grounding, building protein that nourishes depleted Vata tissues and prevents wasting.",effect_zh:"厚重、接地氣、增補的蛋白質，滋養虛弱的風型組織，防止消耗。"},{id:44,name:"Eliminate very spicy foods",name_zh:"戒除極辛辣食物",category:"Lifestyle",mitigates:["P"],effect:"Spicy food directly inflames Pitta's digestive tract and emotions — a cooling diet is essential.",effect_zh:"辛辣食物直接刺激火型的消化道和情緒——清涼飲食至關重要。"},{id:45,name:"Morning sunbathing (15-20 min)",name_zh:"早晨曬太陽（15-20分鐘）",category:"Lifestyle",mitigates:["V","K"],effect:"Gentle warmth and light grounds cold Vata; bright light and heat activate the sluggish Kapha constitution.",effect_zh:"溫和的陽光和熱量安定寒冷的風型；明亮的光線和熱量激活遲緩的水型體質。"},{id:46,name:"Ashwagandha supplement",name_zh:"南非醉茄補充品",category:"Lifestyle",mitigates:["V","K"],effect:"Warming adaptogen builds strength and resilience — counters anxiety and nerve depletion (V) and lethargy (K).",effect_zh:"溫熱適應原，增強力量和韌性——對抗焦慮和神經虛弱（風型）以及倦怠（水型）。"},{id:47,name:"Reduce caffeine and coffee",name_zh:"減少咖啡因和咖啡",category:"Lifestyle",mitigates:["V","P"],effect:"Caffeine dries and agitates Vata's nervous system; heats and acidifies Pitta's digestive and emotional state.",effect_zh:"咖啡因使風型神經系統乾燥和躁動；加熱和酸化火型的消化和情緒狀態。"},{id:48,name:"Warm whole milk only (not cold)",name_zh:"只喝溫熱全脂牛奶（不喝冷飲）",category:"Food",mitigates:["V"],effect:"Warm milk nourishes and builds Vata tissues — cold dairy is one of the most aggravating foods for Vata.",effect_zh:"溫熱牛奶滋養和增補風型組織——冷藏乳製品是最刺激風型的食物之一。"},{id:49,name:"Reduce screen time at night",name_zh:"減少夜間屏幕時間",category:"Lifestyle",mitigates:["V","P"],effect:"Blue light agitates Vata's nervous system and overheats Pitta's mind — essential for quality rest.",effect_zh:"藍光刺激風型神經系統，使火型思緒過熱——對優質休息至關重要。"},{id:50,name:"Steam bath or brief sauna",name_zh:"蒸汽浴或短暫桑拿",category:"Lifestyle",mitigates:["K"],effect:"Heat melts Kapha accumulation in tissues, opens respiratory channels, and stimulates lymphatic clearance.",effect_zh:"熱量融化水型在組織中的積聚，開放呼吸通道，刺激淋巴清除。"}],ge={V:{name:"Vata",name_zh:"風型（Vata）",element:"Air + Ether",element_zh:"風元素 + 空元素",season:"Autumn & Early Winter",season_zh:"秋季及初冬",color:"#8B6FCE",lightColor:"#EDE8FA",midColor:"#C4B4F0",darkColor:"#3d2480",symbol:"🌬",governs:"Movement, circulation, nerve impulses, breathing, elimination",governs_zh:"運動、循環、神經衝動、呼吸、排泄",overview_en:"Vata is the dosha of movement and change. Composed of Air and Ether, it governs every kind of motion in the body and mind — from the beating of the heart and the firing of nerve impulses, to the flow of breath, the movement of food through the digestive tract, and the darting quality of thought itself. When Vata is balanced, a person is creative, enthusiastic, and full of life. When in excess, that same energy becomes scattered, anxious, and depleting.",overview_zh:"風型是運動與變化的督夏。由風元素和空元素組成，主導身體和心理的一切運動——從心臟跳動、神經衝動的觸發，到呼吸的流動、食物在消化道中的移動，以及思緒的靈動特質。當風型平衡時，人充滿創造力、熱情和活力。當過盛時，同樣的能量便變得散亂、焦慮和耗竭。",physical_en:["Naturally thin, light frame that resists weight gain","Dry, rough or flaky skin, especially in cold weather","Cold hands and feet, poor peripheral circulation","Joints that crack or pop; hair tends to be dry and frizzy","Light, easily disturbed sleep; small, restless eyes"],physical_zh:["天生纖細輕盈的體型，不易增重","皮膚乾燥、粗糙或易脫屑，在寒冷天氣時尤為明顯","手腳冰冷，末梢循環不佳","關節易發出響聲；頭髮傾向乾燥和捲曲","睡眠輕淺易醒；眼睛細小而靈動"],mental_en:["Quick to grasp new concepts, but also quick to forget","Highly imaginative and creative — sees connections others miss","Prone to anxiety, worry and fear under stress","Talks fast and enthusiastically, jumping between ideas","Loves novelty, change and variety — routine feels stifling"],mental_zh:["學習新概念很快，但也容易遺忘","高度富有想像力和創造力——能看到他人錯過的連結","在壓力下容易焦慮、擔憂和恐懼","說話快速而充滿熱情，在不同想法之間跳躍","喜愛新鮮事物、變化和多樣性——固定規律令人感到窒息"],balance_en:["Creativity, imagination and original thinking","Infectious enthusiasm and joy for life","Flexibility and ease with change","Quick perception and multi-directional awareness","Spontaneous, playful, expressive energy"],balance_zh:["創造力、想像力和原創思維","感染他人的熱情和對生命的喜悅","靈活性和對變化的從容","快速的感知和多方向的覺察","自發性、玩興十足、富有表達力的能量"],imbalance_en:["Anxiety, fear, nervousness and overwhelm","Insomnia and restless, vivid dreams","Dry skin, constipation and bloating","Joint pain, cracking and poor circulation","Scattered focus, unfinished projects, indecision"],imbalance_zh:["焦慮、恐懼、緊張和不知所措","失眠和躁動、生動的夢境","皮膚乾燥、便秘和腹脹","關節疼痛、響聲和循環不佳","注意力分散、未完成的計劃、優柔寡斷"],aroma_en:"Vata's restless, dry, and anxious nature responds beautifully to warm, grounding, and earthy scents. Sandalwood, vetiver, frankincense, and cedarwood anchor the nervous system and nourish depleted tissue. These oils bring the stillness and warmth that Vata so deeply needs.",aroma_zh:"風型體質容易焦慮、乾燥和散亂，最適合溫暖、沉穩的大地系香氣。檀香、岩蘭草、乳香和雪松能安定神經系統，滋養虛弱的組織。這些精油帶來風型最需要的寧靜與溫暖。",foods:["Warm, cooked, oily foods","Sweet, salty, sour tastes","Basmati rice, oats, wheat","Root vegetables, squash, ghee","Dairy, sesame oil, warm spiced milk"],foods_zh:["溫熱、煮熟、油潤的食物","甜、鹹、酸味","香米、燕麥、小麥","根莖蔬菜、南瓜、酥油","乳製品、芝麻油、溫熱香料牛奶"],avoid:["Raw cold foods and salads","Dry crackers, chips and airy foods","Caffeine and stimulants","Bitter and astringent tastes in excess","Cold drinks and ice"],avoid_zh:["生冷食物和沙律","乾燥餅乾、薯片和輕盈食物","咖啡因和刺激性飲品","過多苦味和澀味","冷飲和冰塊"]},P:{name:"Pitta",name_zh:"火型（Pitta）",element:"Fire + Water",element_zh:"火元素 + 水元素",season:"Summer & Early Autumn",season_zh:"夏季及初秋",color:"#D4743A",lightColor:"#FAF0E6",midColor:"#F0B88A",darkColor:"#7a3a12",symbol:"🔥",governs:"Digestion, metabolism, intelligence, transformation, body temperature",governs_zh:"消化、新陳代謝、智識、轉化、體溫",overview_en:"Pitta is the dosha of transformation. Composed of Fire and Water, it governs digestion in the broadest sense — not just the breakdown of food, but the metabolising of experiences, emotions, and information into wisdom and action. Pitta is the inner fire that gives us appetite, ambition, intelligence, and the drive to achieve. When in balance, it produces extraordinary clarity, courage, and leadership. When in excess, it burns — as inflammation, anger, criticism, and the relentless pursuit of perfection.",overview_zh:"火型是轉化的督夏。由火元素和水元素組成，以最廣泛的意義主導消化——不僅是食物的分解，更是將經歷、情緒和資訊轉化為智慧和行動。火型是給予我們食慾、雄心、智識和成就驅動力的內在之火。當平衡時，它產生非凡的清晰度、勇氣和領導力。當過盛時，它燃燒——以炎症、憤怒、批評和對完美無止境的追求呈現。",physical_en:["Medium, well-proportioned build with good muscle tone","Warm, oily skin prone to redness, flushing and acne","Runs hot — often the warmest person in the room","Profuse sweating with strong odour during exercise","Sharp, penetrating eyes; fine hair prone to early greying"],physical_zh:["中等、比例勻稱的體型，肌肉緊實","溫熱、略油膩的皮膚，易泛紅、潮熱和長暗瘡","體溫偏高——常常是房間裡最暖的人","運動時大量出汗，且氣味較濃","眼神犀利而穿透；頭髮幼細，較早出現白髮"],mental_en:["Sharp, precise intellect with excellent retention","Natural leader — decisive, confident, inspiring","Highly focused and goal-directed","Prone to perfectionism, criticism and impatience","Can become controlling, judgmental or anger-prone under stress"],mental_zh:["犀利、精準的智識，記憶力出色","天生領袖——果斷、自信、有感召力","高度專注且目標明確","容易陷入完美主義、批評和缺乏耐心","在壓力下可能變得控制欲強、愛評判或容易憤怒"],balance_en:["Extraordinary clarity of thought and perception","Courage to act decisively on what matters","Natural ability to lead, inspire and organise","Strong digestive fire and vibrant physical health","Articulate, persuasive and intellectually sharp"],balance_zh:["卓越的思維清晰度和感知力","在重要時刻果斷行動的勇氣","天生領導、激勵和組織他人的能力","強健的消化之火和充沛的身體健康","表達清晰、具說服力和思維銳利"],imbalance_en:["Inflammation, rashes, acne and skin eruptions","Heartburn, acidity and sharp digestive pain","Anger, irritability, criticism and impatience","Perfectionism, burnout and inability to rest","Overheating, excessive sweating and infections"],imbalance_zh:["炎症、皮疹、暗瘡和皮膚問題","胃灼熱、過酸和刺痛感消化痛","憤怒、煩躁、批評和缺乏耐心","完美主義、過勞和無法休息","過熱、過量出汗和感染"],aroma_en:"Pitta's fiery and intense nature is soothed by cool, soft, and floral aromas. Rose, lavender, jasmine, peppermint, and blue chamomile reduce internal heat, calm irritability, and invite the softness Pitta often resists. These cooling oils bring the surrender and ease that Pitta needs most.",aroma_zh:"火型體質容易過熱、急躁，最適合清涼、柔和的花香系精油。玫瑰、薰衣草、茉莉、薄荷和藍甘菊能降低體內熱氣、舒緩情緒，帶來火型常常抗拒的柔軟。這些清涼精油帶來火型最需要的放下和從容。",foods:["Cool, refreshing foods","Sweet, bitter, astringent tastes","Coconut, cucumber, mint, coriander","Basmati rice, barley, oats","Leafy greens, sweet fruits, pomegranate"],foods_zh:["清涼、清爽的食物","甜、苦、澀味","椰子、青瓜、薄荷、芫荽","香米、大麥、燕麥","葉菜類、甜味水果、石榴"],avoid:["Spicy, hot and pungent foods","Fermented foods and alcohol","Red meat in excess","Sour citrus and vinegar","Fried foods and excessive oil"],avoid_zh:["辛辣、刺激性食物","發酵食品和酒精","過多紅肉","酸性柑橘和醋","油炸食品和過多油脂"]},K:{name:"Kapha",name_zh:"水型（Kapha）",element:"Earth + Water",element_zh:"土元素 + 水元素",season:"Late Winter & Spring",season_zh:"冬末及春季",color:"#3A8C6E",lightColor:"#E6F5EF",midColor:"#82C4A8",darkColor:"#164d38",symbol:"🌊",governs:"Structure, cohesion, lubrication, immunity, nourishment",governs_zh:"結構、凝聚力、潤滑、免疫、滋養",overview_en:"Kapha is the dosha of structure and nourishment. Composed of Earth and Water, it provides the body with its physical form, cohesion, lubrication, and immunity. Where Vata is movement and Pitta is transformation, Kapha is substance — the flesh, the fluid, the connective tissue, the memory that holds. When in balance, Kapha gives endurance, compassion, loyalty, and a deep, grounding calm. When in excess, that same heaviness becomes lethargy, attachment, congestion, and a stubborn resistance to the change that life requires.",overview_zh:"水型是結構與滋養的督夏。由土元素和水元素組成，為身體提供物理形態、凝聚力、潤滑和免疫力。若說風型是運動，火型是轉化，那麼水型就是物質——肉體、液體、結締組織和記憶的承載。當平衡時，水型帶來耐力、慈悲、忠誠和深沉、接地氣的平靜。當過盛時，同樣的厚重感變成倦怠、執著、充血，以及對生命所需變化的頑固抗拒。",physical_en:["Broad, solid frame with natural strength and stamina","Thick, smooth, moist and cool skin — often youthful-looking","Gains weight easily, especially around abdomen and thighs","Deep, prolonged sleep — very hard to interrupt or wake","Large, calm, moist eyes with naturally long lashes"],physical_zh:["寬闊結實的體型，天生力量強大、耐力持久","皮膚厚實、光滑、濕潤而偏涼——常常看起來比實際年齡年輕","容易增重，尤其是腹部和大腿","睡眠深沉而持久——很難被打斷或喚醒","眼睛大而平靜、水潤，天生睫毛濃密"],mental_en:["Slow and thorough learner who rarely forgets","Deeply compassionate, nurturing and emotionally stable","Most loyal and reliable of the three types","Prone to attachment, possessiveness and resistance to change","Can become depressed, withdrawn and emotionally stuck"],mental_zh:["學習緩慢而徹底，很少遺忘","深具慈悲心、富有養育性，情緒穩定","三種體質中最忠誠可靠的","容易陷入執著、佔有欲和抗拒改變","可能變得抑鬱、退縮和情緒陷入僵局"],balance_en:["Deep compassion and unconditional nurturing","Patient, steady and unshakeable under pressure","Loyal, trustworthy and deeply reliable","Extraordinary physical endurance and stamina","A grounding, calming presence everyone benefits from"],balance_zh:["深厚的慈悲心和無條件的養育能力","在壓力下保持耐心、穩定和不動搖","忠誠、值得信賴且高度可靠","卓越的體能耐力和持久力","讓周圍所有人受益的接地氣、平靜的存在"],imbalance_en:["Weight gain and difficulty losing weight","Sinus congestion, mucus excess and frequent colds","Lethargy, excessive sleep and low motivation","Depression, emotional eating and possessiveness","Slow metabolism, water retention and lymph congestion"],imbalance_zh:["體重增加且難以減重","鼻竇充血、黏液過多和頻繁感冒","倦怠、過度睡眠和動力低下","抑鬱、情緒性進食和佔有欲","新陳代謝緩慢、水腫和淋巴充血"],aroma_en:"Kapha's heavy and slow nature is awakened by bright, stimulating, and uplifting scents. Eucalyptus, rosemary, grapefruit, black pepper, and ginger energise the body, clear congestion, and counter the emotional heaviness Kapha tends toward. These invigorating oils provide the spark and momentum that Kapha needs most.",aroma_zh:"水型體質容易沉重、遲緩，最適合清新、提振的香氣。尤加利、迷迭香、葡萄柚、黑胡椒和薑能喚醒身體能量、疏通阻塞，對抗水型傾向的情緒沉重。這些振奮人心的精油提供水型最需要的動力和衝勁。",foods:["Light, dry, warm foods","Pungent, bitter, astringent tastes","Millet, barley, rye, buckwheat","Ginger, black pepper, garlic, chilli","Most vegetables (steamed or lightly cooked)"],foods_zh:["輕盈、乾燥、溫熱的食物","辛辣、苦味、澀味","小米、大麥、黑麥、蕎麥","薑、黑胡椒、蒜頭、辣椒","大多數蔬菜（蒸煮或輕度烹飪）"],avoid:["Heavy, oily, sweet, rich foods","Cold dairy products and ice cream","Wheat and excessive bread or pasta","Fried and deep-fried foods","Eating between meals or late at night"],avoid_zh:["厚重、油膩、甜膩、豐盛的食物","冷藏乳製品和雪糕","小麥和過多麵包或麵食","油炸和炸物","在餐間或深夜進食"]}};function Vl(e){let t=0,n=0,r=0;e.forEach((o,l)=>{if(o==null)return;const a=ic.en[l].opts[o].d;a==="V"?t++:a==="P"?n++:r++});const i=t+n+r||1;return{raw:{V:t,P:n,K:r},pct:{V:Math.round(t/i*100),P:Math.round(n/i*100),K:Math.round(r/i*100)}}}function oc(e){const t=[["V",e.V],["P",e.P],["K",e.K]].sort((i,o)=>o[1]-i[1]),n={V:{en:"Vata",zh:"風型"},P:{en:"Pitta",zh:"火型"},K:{en:"Kapha",zh:"水型"}};return t[2][1]>=20&&Math.abs(t[0][1]-t[2][1])<=20?{type:"Tri-Doshic",type_zh:"三重督夏型",label_en:"Vata-Pitta-Kapha",label_zh:"風型-火型-水型",dominant:t[0][0],secondary:t[1][0]}:t[0][1]>=55?{type:"Mono-Doshic",type_zh:"單一督夏型",label_en:n[t[0][0]].en,label_zh:n[t[0][0]].zh,dominant:t[0][0],secondary:null}:{type:"Bi-Doshic",type_zh:"雙重督夏型",label_en:`${n[t[0][0]].en}-${n[t[1][0]].en}`,label_zh:`${n[t[0][0]].zh}-${n[t[1][0]].zh}`,dominant:t[0][0],secondary:t[1][0]}}function Df(e,t,n){const{V:r,P:i,K:o}=e,l=[["Vata","風型",r],["Pitta","火型",i],["Kapha","水型",o]].sort((s,d)=>d[2]-s[2]),[a]=[l[0],l[1],l[2]];return n==="en"?t.type==="Mono-Doshic"?`Your ${a[0]} score of ${a[2]}% indicates a strongly mono-doshic constitution. One primary energy governs your physiology and psychology, giving you clear, predictable traits — but also making you most prone to that dosha's specific imbalances. Consistent, targeted care for ${a[0]} is your most important health strategy.`:t.type==="Tri-Doshic"?`Your near-equal ${r}/${i}/${o} distribution indicates a rare tri-doshic constitution. You carry all three energies in relative balance, giving you remarkable adaptability and resilience. The challenge is maintaining equilibrium — seasonal shifts will cause different doshas to move in and out of dominance throughout the year.`:`Your ${r}/${i}/${o} ratio reveals a bi-doshic constitution where ${a[0]} (${a[2]}%) leads with significant ${l[1][0]} influence (${l[1][2]}%)   :root {

  .btn-lang{padding:.4rem .9rem;border:1px solid var(--gold);border-radius:6px;background:var(--gold-l);font-size:.78rem;font-weight:500;color:var(--gold);transition:all .15s;}

  .btn-primary{padding:.9rem 2.25rem;background:var(--ink);color:var(--paper);border:none;border-radius:8px;font-size:.95rem;font-family:var(--serif);font-weight:500;letter-spacing:.02em;transition:opacity .15s,transform .1s;}

  .tabs{display:flex;gap:4px;background:var(--paper2);border-radius:10px;padding:4px;margin-bottom:1.5rem;}
  .tab{flex:1;padding:.58rem;text-align:center;font-size:.78rem;font-weight:500;border:none;border-radius:7px;background:transparent;color:var(--ink3);transition:all .15s;}
  .tab.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 8px rgba(26,23,20,.08);}

  /* REC SECTIONS */
  .rec-dosha-head{display:flex;align-items:center;gap:10px;margin:1.75rem 0 .9rem;padding-bottom:.5rem;border-bottom:1px solid var(--paper3);}
  .rdh-sym{font-size:1.2rem;}
  .rdh-title{font-family:var(--serif);font-size:1.2rem;font-weight:500;}
  .rdh-badge{font-size:.65rem;padding:3px 9px;border-radius:20px;font-weight:500;margin-left:auto;}
  .badge-V{background:var(--vata-l);color:var(--vata-d);border:1px solid var(--vata-m);}
  .badge-P{background:var(--pitta-l);color:var(--pitta-d);border:1px solid var(--pitta-m);}
  .badge-K{background:var(--kapha-l);color:var(--kapha-d);border:1px solid var(--kapha-m);}
  .rec-type-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:500;margin:.9rem 0 .5rem;}
  .rec-list{display:flex;flex-direction:column;gap:7px;}
  .rec-row{background:var(--paper);border:1px solid var(--paper3);border-radius:10px;padding:.9rem 1.1rem;}
  .rec-rh{display:flex;align-items:center;gap:9px;margin-bottom:.3rem;}
  .rec-ico{font-size:.95rem;}
  .rec-name{font-size:.85rem;font-weight:500;flex:1;}
  .rec-dtags{display:flex;gap:3px;}
  .dtag{font-size:.62rem;padding:2px 7px;border-radius:10px;font-weight:500;}
  .dtag-V{background:var(--vata-l);color:var(--vata-d);border:1px solid var(--vata-m);}
  .dtag-P{background:var(--pitta-l);color:var(--pitta-d);border:1px solid var(--pitta-m);}
  .dtag-K{background:var(--kapha-l);color:var(--kapha-d);border:1px solid var(--kapha-m);}
  .rec-eff{font-size:.77rem;color:var(--ink3);line-height:1.5;padding-left:1.5rem;}

  /* AROMA CARD IN RECS */
  .aroma-card{border-radius:var(--r);padding:1rem 1.2rem;margin-top:.5rem;border:1px dashed var(--paper3);background:var(--gold-l);}
  .ac-head{display:flex;align-items:center;gap:8px;margin-bottom:.4rem;}
  .ac-title{font-size:.82rem;font-weight:500;color:var(--ink);}
  .ac-body{font-size:.77rem;color:var(--ink2);line-height:1.6;margin-bottom:.75rem;}
  .ac-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .ac-btn-p{padding:.5rem 1rem;background:var(--ink);color:var(--paper);border:none;border-radius:6px;font-size:.75rem;font-weight:500;transition:opacity .14s;}
  .ac-btn-p:hover{opacity:.85;}
  .ac-btn-s{padding:.5rem 1rem;background:transparent;border:1px solid var(--paper3);border-radius:6px;font-size:.75rem;color:var(--ink2);transition:all .14s;}
  .ac-btn-s:hover{border-color:var(--gold);color:var(--gold);}

  /* DOSHA GUIDE */
  .guide-sec{margin-bottom:2rem;}
  .guide-head{display:flex;align-items:center;gap:12px;margin-bottom:.75rem;}
  .gh-sym{font-size:1.8rem;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);}
  .gh-name{font-family:var(--serif);font-size:1.3rem;font-weight:500;}
  .gh-elem{font-size:.75rem;color:var(--ink3);margin-top:2px;}
  .guide-overview{font-size:.83rem;color:var(--ink2);line-height:1.8;margin-bottom:1.1rem;padding:1rem 1.2rem;background:var(--paper2);border-radius:var(--r);}
  .guide-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1rem;}
  .g-col{background:var(--paper);border:1px solid var(--paper3);border-radius:var(--r);padding:.85rem 1rem;}
  .g-col h5{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;font-weight:500;color:var(--ink3);margin-bottom:.55rem;}
  .g-col ul{list-style:none;}
  .g-col ul li{font-size:.79rem;color:var(--ink2);padding:3px 0 3px 1rem;position:relative;line-height:1.45;}
  .g-col ul li::before{content:'–';position:absolute;left:0;color:var(--gold);}
  .guide-divider{border:none;border-top:1px solid var(--paper3);margin:2rem 0;}

  /* SOCIAL FOOTER */
  .social-strip{background:var(--paper2);border-radius:var(--rL);padding:1.5rem;margin:2rem 0 1.5rem;text-align:center;border:1px solid var(--paper3);}
  .ss-title{font-family:var(--serif);font-size:1.05rem;font-weight:500;margin-bottom:.35rem;}
  .ss-body{font-size:.8rem;color:var(--ink2);margin-bottom:1rem;line-height:1.6;}
  .ss-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .ss-btn{display:flex;align-items:center;gap:7px;padding:.6rem 1.25rem;border:1px solid var(--paper3);border-radius:7px;background:var(--paper);font-size:.8rem;font-weight:500;color:var(--ink2);transition:all .15s;}
  .ss-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-l);}

  .restart-row{text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--paper3);}
  .btn-restart{padding:.75rem 1.75rem;border:1px solid var(--paper3);border-radius:8px;background:transparent;font-family:var(--serif);font-size:.9rem;color:var(--ink3);transition:all .15s;}
  .btn-restart:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-l);}
  .res-disclaimer{font-size:.72rem;color:var(--ink3);text-align:center;margin-top:1rem;line-height:1.6;padding:0 1rem;}

  /* CAPTURE FORM */
  .capture-wrap{max-width:520px;margin:0 auto;padding:3rem 1.5rem 4rem;text-align:center;}
  .capture-icon{font-size:2.8rem;margin-bottom:1.25rem;}
  .capture-h2{font-family:var(--serif);font-size:1.8rem;font-weight:500;margin-bottom:.6rem;line-height:1.3;}
  .capture-sub{font-size:.88rem;color:var(--ink2);line-height:1.7;margin-bottom:.5rem;}
  .capture-result-pill{display:inline-flex;align-items:center;gap:7px;padding:.35rem 1rem;border-radius:20px;background:var(--paper2);border:1px solid var(--paper3);font-size:.78rem;font-weight:500;color:var(--ink2);margin-bottom:2rem;}
  .capture-form{background:var(--paper);border:1px solid var(--paper3);border-radius:var(--rL);padding:1.75rem;text-align:left;margin-bottom:1rem;}
  .capture-form label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:500;color:var(--ink3);margin-bottom:.4rem;}
  .capture-form input{display:block;width:100%;padding:.7rem 1rem;border:1.5px solid var(--paper3);border-radius:8px;font-family:var(--sans);font-size:.88rem;color:var(--ink);background:var(--paper2);margin-bottom:1rem;outline:none;transition:border-color .14s;}
  .capture-form input:focus{border-color:var(--gold);}
  .capture-form input::placeholder{color:var(--ink3);}
  .capture-privacy{font-size:.72rem;color:var(--ink3);line-height:1.6;margin-top:.5rem;text-align:center;}
  .btn-capture{width:100%;padding:.85rem;background:var(--ink);color:var(--paper);border:none;border-radius:8px;font-family:var(--serif);font-size:1rem;font-weight:500;letter-spacing:.02em;transition:opacity .14s;margin-bottom:.75rem;}
  .btn-capture:hover{opacity:.85;}
  .btn-skip{width:100%;padding:.6rem;background:transparent;border:none;font-size:.8rem;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;transition:color .14s;}
  .btn-skip:hover{color:var(--ink);}
  .capture-sending{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;color:var(--ink3);padding:.5rem;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{width:14px;height:14px;border:2px solid var(--paper3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}

  @media(max-width:600px){
    .ayur-grid,.d-cols,.guide-cols,.type-grid{grid-template-columns:1fr;}
    .l-sec{padding:2rem 1.25rem;}
    .nav{padding:.8rem 1.25rem;}
    .ab-btns,.ac-btns,.ss-btns{flex-direction:column;}
  }
