aw, feel stuck, resist change",d:"K"}]},{id:10,cat:"Emotions",icon:"💧",text:"When emotions are out of balance, you most feel…",opts:[{label:"Vata",text:"Fear, anxiety, nervousness",d:"V"},{label:"Pitta",text:"Anger, jealousy, frustration",d:"P"},{label:"Kapha",text:"Attachment, depression, possessiveness",d:"K"}]},{id:11,cat:"Decisions",icon:"🎯",text:"How do you typically make decisions?",opts:[{label:"Vata",text:"Quickly, but often change your mind",d:"V"},{label:"Pitta",text:"Decisively and logically, with confidence",d:"P"},{label:"Kapha",text:"Slowly and carefully, preferring consensus",d:"K"}]},{id:12,cat:"Climate",icon:"❄️",text:"How do you feel about cold weather?",opts:[{label:"Vata",text:"Dislike it greatly — feel cold constantly",d:"V"},{label:"Pitta",text:"Prefer cool weather, dislike excessive heat",d:"P"},{label:"Kapha",text:"Mildly dislike cold but generally tolerate it",d:"K"}]},{id:13,cat:"Exercise",icon:"🏃",text:"How do you handle physical activity?",opts:[{label:"Vata",text:"Enjoy movement but tire quickly and stay inconsistent",d:"V"},{label:"Pitta",text:"High endurance, competitive, driven to excel",d:"P"},{label:"Kapha",text:"Prefer low intensity; reluctant to start but can sustain",d:"K"}]},{id:14,cat:"Sweating",icon:"💦",text:"How much do you sweat during exertion?",opts:[{label:"Vata",text:"Minimal sweating, dry even when active",d:"V"},{label:"Pitta",text:"Sweat profusely, often with strong odor",d:"P"},{label:"Kapha",text:"Moderate, cool perspiration",d:"K"}]},{id:15,cat:"Joints",icon:"🦴",text:"Your joints are typically…",opts:[{label:"Vata",text:"Cracking, popping, dry, hypermobile",d:"V"},{label:"Pitta",text:"Flexible, warm, occasionally inflamed",d:"P"},{label:"Kapha",text:"Strong, well-padded, very stable",d:"K"}]},{id:16,cat:"Speech",icon:"🗣️",text:"How do you naturally speak?",opts:[{label:"Vata",text:"Fast, enthusiastic, jumping between topics",d:"V"},{label:"Pitta",text:"Clear, precise, articulate, convincing",d:"P"},{label:"Kapha",t ating while reducing Pitta acidity and heartburn."},{id:43,name:"Red meat (in moderation)",category:"Food",mitigates:["V"],effect:"Heavy, grounding, building protein that nourishes depleted Vata tissues and prevents wasting."},{id:44,name:"Eliminate very spicy foods",category:"Lifestyle",mitigates:["P"],effect:"Spicy food directly inflames Pitta's digestive tract and emotions — a cooling diet is essential."},{id:45,name:"Morning sunbathing (15-20 min)",category:"Lifestyle",mitigates:["V","K"],effect:"Gentle warmth and light grounds cold Vata; bright light and heat activate the sluggish Kapha constitution."},{id:46,name:"Ashwagandha supplement",category:"Lifestyle",mitigates:["V","K"],effect:"Warming adaptogen builds strength and resilience — counters anxiety and nerve depletion (V) and lethargy (K)."},{id:47,name:"Reduce caffeine and coffee",category:"Lifestyle",mitigates:["V","P"],effect:"Caffeine dries and agitates Vata's nervous system; heats and acidifies Pitta's digestive and emotional state."},{id:48,name:"Warm whole milk only (not cold)",category:"Food",mitigates:["V"],effect:"Warm milk nourishes and builds Vata tissues — cold dairy is one of the most aggravating foods for Vata."},{id:49,name:"Reduce screen time at night",category:"Lifestyle",mitigates:["V","P"],effect:"Blue light agitates Vata's nervous system and overheats Pitta's mind — essential for quality rest."},{id:50,name:"Steam bath or brief sauna",category:"Lifestyle",mitigates:["K"],effect:"Heat melts Kapha accumulation in tissues, opens respiratory channels, and stimulates lymphatic clearance."}],rt={V:{name:"Vata",element:"Air + Ether",season:"Autumn & Early Winter",color:"#8B6FCE",lightColor:"#EDE8FA",midColor:"#C4B4F0",darkColor:"#3d2480",symbol:"🌬",governs:"Movement, circulation, nerve impulses, breathing, elimination",balanced:["Creative & imaginative","Enthusiastic & vivacious","Flexible & adaptable","Quick mind & perception","Communicative & expressive"],imbalanced:["Anxiety & fear","Insomnia & restlessness","Dry skin & constipation","Scattered focus","Joint pain & cracking"],foods:["Warm, cooked, oily foods","Sweet, salty, sour tastes","Basmati rice, oats, wheat","Root vegetables, squash","Dairy, ghee, sesame oil"],avoid:["Raw cold foods","Dry crackers and chips","Caffeine and stimulants","Bitter and astringent foods","Very light or airy foods"]},P:{name:"Pitta",element:"Fire + Water",season:"Summer & Early Autumn",color:"#D4743A",lightColor:"#FAF0E6",midColor:"#F0B88A",darkColor:"#7a3a12",symbol:"🔥",governs:"Digestion, metabolism, intelligence, perception, transformation",balanced:["Sharp intellect & focus","Courageous & confident","Natural leadership ability","Articulate & persuasive","Strong digestion & metabolism"],imbalanced:["Inflammation & rashes","Anger & irritability","Heartburn & acidity","Perfectionism & criticism","Overheating & excess sweating"],foods:["Cool, refreshing foods","Sweet, bitter, astringent tastes","Coconut, cucumber, cilantro","Leafy greens, sweet fruits","Basmati rice, barley, oats"],avoid:["Spicy, hot, pungent foods","Fermented foods and alcohol","Red meat in excess","Sour citrus and vinegar","Excessive oils and fried food"]},K:{name:"Kapha",element:"Earth + Water",season:"Late Winter & Spring",color:"#3A8C6E",lightColor:"#E6F5EF",midColor:"#82C4A8",darkColor:"#164d38",symbol:"🌊",governs:"Structure, cohesion, lubrication, immunity, nourishment",balanced:["Compassionate & loving","Patient & forgiving","Strong & enduring stamina","Loyal and trustworthy","Calm and nurturing presence"],imbalanced:["Weight gain & lethargy","Congestion & mucus excess","Depression & attachment","Resistance to change","Slow metabolism & digestion"],foods:["Light, dry, warm foods","Pungent, bitter, astringent tastes","Millet, barley, rye","Spicy peppers, ginger, garlic","Light legumes, most vegetables"],avoid:["Heavy, oily, sweet foods","Cold dairy and ice cream","Wheat and excessive bread","Fried and rich foods","Eating between meals"]}};functio   @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,600&family=Jost:wght@300;400;500&display=swap');

  :root {
    --vata: #8B6FCE; --vata-l: #EDE8FA; --vata-m: #C4B4F0; --vata-d: #3d2480;
    --pitta: #D4743A; --pitta-l: #FDF4ED; --pitta-m: #F0B88A; --pitta-d: #7a3a12;
    --kapha: #3A8C6E; --kapha-l: #EBF6F1; --kapha-m: #82C4A8; --kapha-d: #164d38;
    --gold: #C9A84C; --gold-l: #FBF6EB;
    --ink: #1a1714; --ink2: #4a4540; --ink3: #8a847e;
    --paper: #FDFAF6; --paper2: #F5F0E8; --paper3: #EDE8DC;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Jost', system-ui, sans-serif;
    --r: 12px; --rL: 20px;
    --shadow: 0 2px 16px rgba(26,23,20,0.08);
    --shadow-lg: 0 8px 40px rgba(26,23,20,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font-family: var(--sans); cursor: pointer; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* NAV */
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--paper3); background: var(--paper); position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .nav-brand span { font-size: 1.3rem; }
  .nav-actions { display: flex; gap: 8px; }
  .btn-outline { padding: 0.45rem 1.1rem; border: 1px solid var(--paper3); border-radius: 6px; background: transparent; font-size: 0.82rem; color: var(--ink2); transition: all 0.15s; }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-l); }

  /* HERO */
  .hero { text-align: center; padding: 5rem 2rem 4rem; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, #EDE8FA 0%, transparent 70%); opacity: 0.6; }
  .hero-inner { position: relative; }
  .hero-mandala { font-size: 3.5rem; line-height: 1; margin-bottom: 1.5rem; animation: rotSlow 40s linear infinite; display: inline-block; }
  @keyframes rotSlow { to { transform: rotate(360deg); } }
  .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 500; line-height: 1.2; color: var(--ink); margin-bottom: 1rem; }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero-sub { font-size: 1rem; color: var(--ink3); max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.7; }

  /* DOSHA INTRO CARDS */
  .dosha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; max-width: 900px; margin: 0 auto 3rem; padding: 0 1.5rem; }
  .d-card { border-radius: var(--rL); padding: 1.5rem; border: 1px solid var(--paper3); background: var(--paper); transition: transform 0.2s, box-shadow 0.2s; cursor: default; }
  .d-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .d-card.vata  { border-top: 3px solid var(--vata); }
  .d-card.pitta { border-top: 3px solid var(--pitta); }
  .d-card.kapha { border-top: 3px solid var(--kapha); }
  .d-symbol { font-size: 2rem; margin-bottom: 0.75rem; }
  .d-elem { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500; margin-bottom: 0.25rem; }
  .d-card.vata .d-elem  { color: var(--vata); }
  .d-card.pitta .d-elem { color: var(--pitta); }
  .d-card.kapha .d-elem { color: var(--kapha); }
  .d-card h3 { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
  .d-card.vata  h3 { color: var(--vata-d); }
  .d-card.pitta h3 { color: var(--pitta-d); }
  .d-card.kapha h3 { color: var(--kapha-d); }
  .d-card p { font-size: 0.82rem; color: var(--ink2); line-height: 1.6; margin-bottom: 0.75rem; }
  .d-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill { font-size: 0.68rem; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .vata  .pill { background: var(--vata-m); color: var(--vata-d); }
  .pitta .pill { background: var(--pitta-m); color: var(--pitta-d); }
  .kapha .pill { background: var(--kapha-m); color: var(--kapha-d); }

  .start-cta { display: flex; align-items: center; gap: 1rem; justify-content: center; flex-wrap: wrap; padding: 0 1.5rem 5rem; }
  .btn-primary { padding: 1rem 2.5rem; background: var(--ink); color: var(--paper); border: none; border-radius: 8px; font-size: 1rem; font-family: var(--serif); font-weight: 500; letter-spacing: 0.03em; transition: opacity 0.15s, transform 0.1s; }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .cta-note { font-size: 0.78rem; color: var(--ink3); }

  /* QUIZ */
  .quiz-wrap { max-width: 660px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .progress-wrap { margin-bottom: 2rem; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-num { font-size: 0.75rem; font-weight: 500; color: var(--ink3); }
  .progress-cat { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); font-weight: 500; }
  .progress-track { height: 2px; background: var(--paper3); border-radius: 2px; }
  .progress-fill { height: 2px; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
  .dosha-mini-bars { display: flex; gap: 4px; margin-top: 8px; }
  .mini-bar { height: 3px; border-radius: 2px; transition: flex 0.4s ease; }

  .q-animate { animation: qFade 0.3s ease both; }
  @keyframes qFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .q-icon { font-size: 1.5rem; margin-bottom: 0.75rem; }
  .q-text { font-family: var(--serif); font-size: 1.45rem; font-weight: 400; line-height: 1.4; color: var(--ink); margin-bottom: 1.5rem; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn { text-align: left; padding: 1rem 1.2rem; border: 1.5px solid var(--paper3); border-radius: 10px; background: var(--paper); color: var(--ink); transition: all 0.15s; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .opt-btn:hover { border-color: var(--gold); background: var(--gold-l); }
  .opt-btn.sel-V { border-color: var(--vata); background: var(--vata-l); }
  .opt-btn.sel-P { border-color: var(--pitta); background: var(--pitta-l); }
  .opt-btn.sel-K { border-color: var(--kapha); background: var(--kapha-l); }
  .opt-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-V { background: var(--vata); }
  .dot-P { background: var(--pitta); }
  .dot-K { background: var(--kapha); }
  .opt-inner { display: flex; flex-direction: column; gap: 2px; }
  .opt-dosha-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 500; color: var(--ink3); }
  .opt-text { font-size: 0.88rem; color: var(--ink2); line-height: 1.4; }
  .opt-btn.sel-V .opt-dosha-label { color: var(--vata-d); }
  .opt-btn.sel-P .opt-dosha-label { color: var(--pitta-d); }
  .opt-btn.sel-K .opt-dosha-label { color: var(--kapha-d); }

  .q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; }
  .btn-ghost { padding: 0.6rem 1.25rem; border: 1px solid var(--paper3); border-radius: 7px; background: transparent; font-size: 0.84rem; color: var(--ink3); transition: all 0.14s; }
  .btn-ghost:hover:not(:disabled) { border-color: var(--ink3); color: var(--ink); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-advance { padding: 0.7rem 1.8rem; background: var(--ink); color: var(--paper); border: none; border-radius: 7px; font-size: 0.88rem; font-weight: 500; letter-spacing: 0.02em; transition: all 0.14s; }
  .btn-advance:hover:not(:disabled) { background: var(--ink2); }
  .btn-advance:disabled { opacity: 0.3; cursor: not-allowed; }

  /* RESULTS */
  .results-wrap { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

  .res-hero { text-align: center; padding: 2.5rem 1rem 2rem; }
  .res-glyph { font-size: 2.5rem; margin-bottom: 1rem; }
  .res-hero h2 { font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 500; margin-bottom: 0.5rem; }
  .prakriti-badge { display: inline-flex; align-items: center; gap: 8px; padding: 0.4rem 1.25rem; border-radius: 30px; background: var(--paper2); border: 1px solid var(--paper3); font-size: 0.78rem; font-weight: 500; color: var(--ink2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.75rem; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* SCORE BARS */
  .score-card { background: var(--paper); border: 1px solid var(--paper3); border-radius: var(--rL); padding: 1.5rem; margin: 1.5rem 0; }
  .score-row { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 12px; margin-bottom: 14px; }
  .score-row:last-child { margin-bottom: 0; }
  .score-label { font-family: var(--serif); font-size: 1rem; font-weight: 600; }
  .score-label.V { color: var(--vata); }
  .score-label.P { color: var(--pitta); }
  .score-label.K { color: var(--kapha); }
  .bar-track { height: 8px; background: var(--paper2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 8px; border-radius: 4px; transition: width 1.2s cubic-bezier(0.34, 1.3, 0.64, 1); }
  .bar-V { background: var(--vata); }
  .bar-P { background: var(--pitta); }
  .bar-K { background: var(--kapha); }
  .score-pct { font-size: 0.9rem; font-weight: 500; text-align: right; }

  /* RATIO EXPLAIN */
  .ratio-box { background: var(--paper2); border-radius: var(--r); padding: 1.25rem 1.5rem; margin-bottom: 2rem; border-left: 3px solid var(--gold); }
  .ratio-box h4 { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
  .ratio-box p { font-size: 0.84rem; color: var(--ink2); line-height: 1.7; }

  /* TABS */
  .tabs { display: flex; gap: 4px; background: var(--paper2); border-radius: 10px; padding: 4px; margin-bottom: 1.5rem; }
  .tab { flex: 1; padding: 0.6rem; text-align: center; font-size: 0.8rem; font-weight: 500; border: none; border-radius: 7px; background: transparent; color: var(--ink3); transition: all 0.15s; }
  .tab.active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }

  /* SECTION HEADERS */
  .sec-head { font-family: var(--serif); font-size: 1.35rem; font-weight: 500; margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--paper3); }

  /* RECOMMENDATION ROWS */
  .rec-list { display: flex; flex-direction: column; gap: 8px; }
  .rec-row { background: var(--paper); border: 1px solid var(--paper3); border-radius: 10px; padding: 1rem 1.1rem; }
  .rec-row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 0.35rem; }
  .rec-icon { font-size: 1rem; flex-shrink: 0; }
  .rec-name { font-size: 0.88rem; font-weight: 500; flex: 1; }
  .rec-tags { display: flex; gap: 4px; }
  .dtag { font-size: 0.64rem; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .dtag-V { background: var(--vata-l); color: var(--vata-d); border: 1px solid var(--vata-m); }
  .dtag-P { background: var(--pitta-l); color: var(--pitta-d); border: 1px solid var(--pitta-m); }
  .dtag-K { background: var(--kapha-l); color: var(--kapha-d); border: 1px solid var(--kapha-m); }
  .rec-effect { font-size: 0.78rem; color: var(--ink3); line-height: 1.5; padding-left: 1.5rem; }

  /* DOSHA DETAIL PANEL */
  .dosha-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
  .det-card { background: var(--paper); border: 1px solid var(--paper3); border-radius: var(--r); padding: 1.1rem; }
  .det-card h5 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; color: var(--ink3); margin-bottom: 0.6rem; }
  .det-list { list-style: none; }
  .det-list li { font-size: 0.8rem; color: var(--ink2); padding: 3px 0; padding-left: 1rem; position: relative; line-height: 1.4; }
  .det-list li::before { content: '—'; position: absolute; left: 0; color: var(--gold); font-size: 0.7rem; }

  /* JSON PANEL */
  .json-btn { display: flex; align-items: center; gap: 8px; padding: 0.7rem 1.25rem; border: 1px solid var(--paper3); border-radius: 8px; background: var(--paper); font-size: 0.8rem; color: var(--ink3); transition: all 0.14s; margin-bottom: 8px; width: 100%; }
  .json-btn:hover { border-color: var(--ink3); color: var(--ink); }
  .json-panel { background: var(--ink); border-radius: 10px; padding: 1.25rem; overflow-x: auto; max-height: 480px; overflow-y: auto; }
  .json-panel pre { font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.72rem; line-height: 1.7; color: #c9c3b8; }

  /* RESTART */
  .restart-row { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--paper3); }
  .btn-restart { padding: 0.8rem 2rem; border: 1px solid var(--paper3); border-radius: 8px; background: transparent; font-family: var(--serif); font-size: 0.95rem; color: var(--ink3); transition: all 0.15s; }
  .btn-restart:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-l); }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .dosha-grid { grid-template-columns: 1fr; }
    .dosha-detail { grid-template-columns: 1fr; }
    .hero { padding: 3rem 1.5rem 2.5rem; }
    .nav { padding: 1rem 1.25rem; }
  }
